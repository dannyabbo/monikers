<style>
/* Layout: one-screen phone app; a felt-blue game table, white cards on top, actions in thumb reach at the bottom. */
:root {
  --bg: #e9ecfb;

    --accent: #6f7dff; --accent-ink: #0c0e26; --sun: #ffcf4d; --sun-ink: #2a2100;
    --card: #fffaf0; --card-ink: #15183a; --card-muted: #5b5d74;
    --good: #35c27a; --bad: #ff6970;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10122b; --surface: #1b1e42; --surface-2: #262a57; --ink: #eef0ff; --muted: #a3a8d6; --line: #343a72;
  --accent: #6f7dff; --accent-ink: #0c0e26; --sun: #ffcf4d; --sun-ink: #2a2100;
  --card: #fffaf0; --card-ink: #15183a; --card-muted: #5b5d74;
  --good: #35c27a; --bad: #ff6970;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#app {
  height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 16px;
}
.screen { flex: 1; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding-bottom: 8px; margin-inline: -4px; padding-inline: 4px; }
.footer { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1; }

h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.05; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: clamp(38px, 11.5vw, 58px); }
.subname { font-family: var(--display); font-size: clamp(19px, 5.6vw, 26px); line-height: 1.1; color: var(--accent); margin-top: 6px; text-wrap: balance; }

h3 { font-size: 20px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 54px; padding: 0 20px; border-radius: 16px; font-weight: 800; font-size: 18px;
  background: var(--surface); color: var(--ink); border: 2px solid var(--line);
  transition: transform .08s ease;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sun { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); min-height: 44px; font-size: 16px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); font-size: 22px; font-weight: 800; }
.iconbtn:active { background: var(--surface-2); }

.topbar { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.topbar .title { flex: 1; font-weight: 800; font-size: 15px; color: var(--muted); text-align: center; }

.panel { background: var(--surface); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .label { font-weight: 700; font-size: 15px; }
.hint { font-size: 13px; color: var(--muted); }

input[type="text"] {
  font: inherit; width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink); font-weight: 600;
}
.seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 42px; border-radius: 10px; font-weight: 700; font-size: 15px; color: var(--muted); padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.stepper { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.stepper button { width: 42px; height: 42px; border-radius: 10px; font-size: 22px; font-weight: 800; background: var(--surface); }
.stepper output { min-width: 44px; text-align: center; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.setrow .label { font-weight: 700; }
.toggle { width: 56px; height: 34px; border-radius: 99px; background: var(--line); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.toggle[aria-pressed="true"] { background: var(--good); }
.toggle[aria-pressed="true"]::after { transform: translateX(22px); }

.teamdot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border-radius: 99px; font-weight: 800; font-size: 14px; background: var(--surface); border: 1px solid var(--line); }

/* Home */
.home-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding-top: 12px; }
.fan { position: relative; height: 190px; margin: 0 auto 6px; width: 320px; max-width: 100%; }
.fan .mini { position: absolute; left: 50%; top: 10px; width: 116px; height: 160px; margin-left: -58px; border-radius: 14px; background: var(--card); color: var(--card-ink); box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; border-top: 10px solid var(--p1); }
.fan .mini b { font-family: var(--display); font-weight: 400; font-size: 18px; line-height: 1.02; }
.fan .mini span { font-size: 11px; color: var(--card-muted); font-weight: 600; }
.fan .mini:nth-child(1) { transform: translateX(-96px) rotate(-12deg); border-top-color: var(--p3); }
.fan .mini:nth-child(2) { transform: rotate(-2deg) translateY(-8px); border-top-color: var(--p2); }
.fan .mini:nth-child(3) { transform: translateX(96px) rotate(10deg); border-top-color: var(--p4); }
.tagline { font-size: 18px; color: var(--muted); max-width: 30ch; }
.rounds-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rounds-mini div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.rounds-mini b { display: block; font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--accent); line-height: 1; }
.rounds-mini span { font-size: 13px; font-weight: 700; }
.credit { font-size: 12px; color: var(--muted); text-align: center; }
.screen.home { overflow-y: auto; }
@media (max-height: 760px) {
  .home-hero { gap: 12px; padding-top: 0; }
  .fan { height: 140px; width: 280px; }
  .fan .mini { width: 96px; height: 128px; margin-left: -48px; padding: 10px; }
  .fan .mini b { font-size: 15px; }
  .fan .mini:nth-child(1) { transform: translateX(-80px) rotate(-12deg); }
  .fan .mini:nth-child(3) { transform: translateX(80px) rotate(10deg); }
  .rounds-mini { display: none; }
  .tagline { font-size: 16px; }
}

/* The card */
.card {
  background: var(--card); color: var(--card-ink); border-radius: 22px; box-shadow: var(--shadow);
  padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden;
  border-top: 14px solid var(--pc, var(--p1));
}
.card .cname { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 10vw, 46px); line-height: 1.02; text-wrap: balance; overflow-wrap: anywhere; padding-right: 54px; }
.card .cdesc { font-size: 17px; line-height: 1.4; color: var(--card-muted); font-weight: 500; }
.card .pts { position: absolute; top: 14px; right: 14px; width: 46px; height: 46px; border-radius: 50%; background: var(--pc); color: #fff; display: grid; place-items: center; font-family: var(--display); font-size: 24px; line-height: 1; }
.card.enter { animation: deal .22s cubic-bezier(.2,.9,.3,1.2); }
.card.custom .cdesc { font-style: italic; }
@keyframes deal { from { transform: translateY(18px) rotate(-2deg) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card.enter { animation: none; } .btn:active { transform: none; } }

/* Draft */
.draft-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dcard {
  text-align: left; background: var(--card); color: var(--card-ink); border-radius: 14px; padding: 12px 12px 36px; min-height: 128px;
  display: flex; flex-direction: column; gap: 6px; border: 3px solid transparent; border-top: 8px solid var(--pc); position: relative; box-shadow: var(--shadow);
}
.dcard b { font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.05; padding-right: 22px; overflow-wrap: anywhere; }
.dcard span { font-size: 12.5px; color: var(--card-muted); line-height: 1.3; font-weight: 500; }
.dcard i { position: absolute; top: 6px; right: 8px; font-style: normal; font-weight: 800; font-size: 14px; color: var(--pc); }
.dcard[aria-pressed="true"] { border-color: var(--accent); outline: 3px solid var(--accent); outline-offset: -1px; }
.dcard[aria-pressed="true"]::after { content: "✓"; position: absolute; bottom: 8px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.counter { font-variant-numeric: tabular-nums; font-weight: 800; }

/* Pass the phone */
.pass { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; }
.pass .big { font-family: var(--display); font-size: clamp(40px, 13vw, 60px); line-height: 1; }
.pass .who { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; }
.rule-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; width: 100%; text-align: left; display: flex; gap: 14px; align-items: flex-start; }
.rule-card .num { font-family: var(--display); font-size: 44px; line-height: .9; color: var(--accent); flex: none; width: 36px; text-align: center; }
.rule-card h3 { margin-bottom: 4px; }

/* Turn */
.turn-head { display: flex; align-items: center; gap: 8px; }
.timer { position: relative; height: 56px; border-radius: 16px; background: var(--surface-2); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.timer .fill { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--tc, var(--accent)); opacity: .9; transform-origin: left; }
.timer .num { position: relative; font-family: var(--display); font-size: 34px; color: var(--ink); font-variant-numeric: tabular-nums; mix-blend-mode: normal; }
.timer.low .fill { background: var(--bad); }
.timer.low .num { animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.turn-meta { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.turn-actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.turn-actions .btn { min-height: 76px; font-size: 22px; border-radius: 20px; }
.btn.got { background: var(--good); border-color: var(--good); color: #fff; }

/* Overlay */
.overlay { position: fixed; inset: 0; background: rgba(10,12,35,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 20;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 520px; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }

/* Review + scores */
.list { display: flex; flex-direction: column; gap: 8px; }
.li { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.li .nm { flex: 1; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.li.off .nm { text-decoration: line-through; color: var(--muted); }
.li.skipped { background: transparent; border-style: dashed; }
.li button.small-btn.add { background: var(--good); color: #fff; }
.chip { flex: none; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 99px; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; background: var(--pc, var(--accent)); }
.li button.small-btn { flex: none; min-height: 36px; padding: 0 12px; border-radius: 10px; background: var(--surface-2); font-weight: 700; font-size: 14px; }
.scoretable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.scoretable th, .scoretable td { padding: 10px 6px; text-align: right; border-bottom: 1px solid var(--line); }
.scoretable th:first-child, .scoretable td:first-child { text-align: left; }
.scoretable th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.scoretable td.total { font-family: var(--display); font-size: 22px; }
.scoretable .tn { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.tablewrap { overflow-x: auto; }
.winner { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 10px 0; }
.winner .crown { font-family: var(--display); font-size: clamp(42px, 13vw, 64px); line-height: 1; }
.bigscore { font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }

.rules h3 { margin-top: 6px; }
.rules p, .rules li { color: var(--ink); }
.rules ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

.custom-list { display: flex; flex-direction: column; gap: 8px; }

/* Multi-phone */
.home-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.roomtag { min-width: 44px; text-align: right; font-weight: 800; letter-spacing: .12em; font-size: 14px; color: var(--accent); }
.netstatus { align-self: center; background: var(--sun); color: var(--sun-ink); font-weight: 800; font-size: 13px; padding: 4px 12px; border-radius: 99px; }
.codehero { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 6px 0 2px; }
.roomcode { font-family: var(--display); font-size: clamp(64px, 22vw, 96px); line-height: 1; letter-spacing: .08em; color: var(--accent); }
.codeinput { font-family: var(--display) !important; font-size: 34px !important; letter-spacing: .3em; text-transform: uppercase; text-align: center; min-height: 64px !important; }
.teampanel { border-left: 6px solid var(--tc); }
.teampanel input[type="text"] { min-height: 42px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 99px; font-weight: 700; font-size: 15px; min-height: 36px; padding: 0 4px 0 12px; }
.pchip > span, .pchip > button:first-child { padding-right: 8px; min-height: 36px; display: inline-flex; align-items: center; font-weight: 700; }
.pchip.off { opacity: .5; }
.pchip .x { width: 30px; height: 30px; border-radius: 50%; font-size: 18px; color: var(--muted); }
.guessbig { font-family: var(--display); font-size: clamp(64px, 22vw, 104px); line-height: 1; color: var(--accent); }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-weight: 600; }
</style>

const CARDS = CARD_TEXT.trim().split('\n').map(l => {
  const [p, name, desc] = l.split('|');
  return { pts: +p, name, desc };
});

/* ---------- Constants ---------- */
const STORE_KEY = 'monikers-home-v1';
const ROUNDS = [
  { short: 'Anything goes', rule: 'Say anything except the name on the card. Describe it, act it out, sing, hum, point.' },
  { short: 'One word', rule: 'Give exactly one word. You can repeat that word and act along, but no other words.' },
  { short: 'Charades', rule: 'No words at all. Act it out. Gestures and sound effects only.' },
];
const TEAM_NAMES = ['Blue', 'Gold', 'Pink', 'Teal'];
const SECONDS = [30, 45, 60, 90];

/* ---------- State ---------- */
let S = null;
function defaultSettings() {
  return {
    teams: [{ name: 'Team Blue' }, { name: 'Team Gold' }],
    players: 6, mode: 'draft', deal: 10, keep: 7, seconds: 60, carry: true,
  };
}
function fresh() { return { screen: 'home', settings: defaultSettings(), game: null }; }
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- Helpers ---------- */
const $app = document.getElementById('app');
const $ov = document.getElementById('overlay-root');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const teamColor = i => `var(--t${i % 4})`;
const ptsColor = p => `var(--p${clamp(p, 1, 4)})`;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const G = () => S.game;

function maxDeal(players) { return Math.max(2, Math.floor(CARDS.length / players)); }
function suggestKeep(players) { return clamp(Math.round(45 / players), 3, 10); }
function deckSize(st) { return st.players * st.keep; }

/* ---------- Audio / haptics / wake lock ---------- */
let actx = null;
function audio() {
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
  return actx;
}
function beep(freq, dur, vol = 0.15, type = 'sine') {
  const c = actx; if (!c) return;
  try {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(c.destination);
    const t = c.currentTime; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
let wake = null;
async function holdWake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) { wake = null; } }
function dropWake() { try { wake && wake.release(); } catch (e) {} wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S && S.screen === 'turn') holdWake(); });

/* ---------- Rendering ---------- */
function cardHTML(c, extra = '') {
  return `<article class="card ${extra} ${c.custom ? 'custom' : ''}" style="--pc:${ptsColor(c.pts)}">
    <div class="pts" role="img" aria-label="${plural(c.pts, 'point')}">${c.pts}</div>
    <div class="cname">${esc(c.name)}</div>
    <div class="cdesc">${esc(c.desc)}</div>
  </article>`;
}
function topbar(title, back = 'menu') {
  const left = back === 'home' ? `<button class="iconbtn" data-a="go" data-v="home" aria-label="Back">‹</button>`
    : back === 'menu' ? `<button class="iconbtn" data-a="menu" aria-label="Game menu">⋯</button>` : `<span style="width:44px"></span>`;
  return `<div class="topbar">${left}<div class="title">${esc(title)}</div><span style="width:44px"></span></div>`;
}
function teamPill(i) { const t = G().teams[i]; return `<span class="pill"><span class="teamdot" style="background:${teamColor(i)}"></span>${esc(t.name)}</span>`; }

              ${[['draft', 'Draft'], ['quick', 'Quick deal'], ['custom', 'Write own']].map(([k, l]) => `<button data-a="mode" data-v="${k}" aria-pressed="${st.mode === k}">${l}</button>`).join('')}
            </div>
            <p class="hint">${st.mode === 'draft' ? 'Pass the phone. Each player secretly keeps their favorites from a hand.' : st.mode === 'quick' ? 'The app deals a random deck. Fastest way to start.' : 'Each player types in their own names. Blanks get filled with random cards.'}</p>
          </div>
          ${st.mode === 'draft' ? `<div class="setrow"><span class="label">Cards dealt each</span>
            <div class="stepper"><button data-a="deal" data-v="-1" aria-label="Deal fewer">−</button><output>${st.deal}</output><button data-a="deal" data-v="1" aria-label="Deal more">+</button></div></div>` : ''}
          <div class="setrow"><span class="label">${st.mode === 'draft' ? 'Cards kept each' : st.mode === 'custom' ? 'Names per player' : 'Cards per player'}</span>
            <div class="stepper"><button data-a="keep" data-v="-1" aria-label="Fewer">−</button><output>${st.keep}</output><button data-a="keep" data-v="1" aria-label="More">+</button></div></div>
          <p class="hint">Deck: <b>${deckSize(st)} cards</b>. Around 40 to 50 plays best.${st.mode === 'draft' && st.deal >= md ? ` Max deal for ${st.players} players is ${md}.` : ''}</p>
        </div>

        <div class="panel">
          <div class="field"><span class="label">Seconds per turn</span>
            <div class="seg" role="group" aria-label="Seconds per turn">
              ${SECONDS.map(s => `<button data-a="secs" data-v="${s}" aria-pressed="${st.seconds === s}">${s}</button>`).join('')}
            </div>
          </div>
          <div class="setrow"><div><div class="label">Carry over leftover time</div><p class="hint">Clear the deck early and keep your remaining seconds for the next round.</p></div>
            <button class="toggle" data-a="carry" aria-pressed="${st.carry}" aria-label="Carry over leftover time"></button></div>
        </div>
      </div>
      <div class="footer"><button class="btn primary block" data-a="begin">${st.mode === 'quick' ? 'Deal and start' : st.mode === 'draft' ? 'Start the draft' : 'Start writing names'}</button></div>
    </div>`;
  },

  draft() {
    const g = G(), d = g.draft, st = S.settings;
    if (!d.reveal) {
      return `<div class="screen">${topbar(`Draft · player ${d.player + 1} of ${st.players}`)}
        <div class="pass">
          <p class="eyebrow">Pass the phone to</p>
          <div class="big">Player ${d.player + 1}</div>
          <p class="muted" style="max-width:30ch">Pick ${st.keep} of ${st.deal} cards to put in the deck. Keep them secret.</p>
        </div>
        <div class="footer"><button class="btn primary block" data-a="reveal">Show my cards</button></div></div>`;
    }
    const n = d.picked.length;
    return `<div class="screen">${topbar(`Player ${d.player + 1} of ${st.players}`)}
      <div class="row"><p class="grow"><b>Keep ${st.keep}.</b> <span class="muted small">Tap to choose.</span></p><span class="counter">${n} / ${st.keep}</span></div>
      <div class="scroll"><div class="draft-grid">
        ${d.hand.map((c, i) => `<button class="dcard" data-a="pick" data-v="${i}" aria-pressed="${d.picked.includes(i)}" style="--pc:${ptsColor(c.pts)}">
          <i>${c.pts}</i><b>${esc(c.name)}</b><span>${esc(c.desc)}</span></button>`).join('')}
      </div></div>
      <div class="footer"><button class="btn primary block" data-a="draftDone" ${n === st.keep ? '' : 'disabled'}>${n === st.keep ? (d.player + 1 < st.players ? 'Lock in and pass' : 'Lock in and start') : `Pick ${st.keep - n} more`}</button></div>
    </div>`;
  },

  custom() {
    const g = G(), c = g.custom, st = S.settings;
    if (!c.reveal) {
      return `<div class="screen">${topbar(`Names · player ${c.player + 1} of ${st.players}`)}
        <div class="pass">
          <p class="eyebrow">Pass the phone to</p>
          <div class="big">Player ${c.player + 1}</div>
          <p class="muted" style="max-width:32ch">Write ${st.keep} names everyone at the table could plausibly guess: people, characters, things. Keep them secret.</p>
        </div>
        <div class="footer"><button class="btn primary block" data-a="reveal">I'm ready</button></div></div>`;
    }
    return `<div class="screen">${topbar(`Player ${c.player + 1} of ${st.players}`)}
      <div class="scroll"><div class="custom-list">
        ${c.entries.map((v, i) => `<input type="text" id="name-${i}" data-in="name" data-v="${i}" value="${esc(v)}" maxlength="60" placeholder="Name ${i + 1}" autocomplete="off" autocapitalize="words">`).join('')}
      </div><p class="hint">Blank lines get a random card from the deck instead.</p></div>
      <div class="footer"><button class="btn primary block" data-a="customDone">${c.player + 1 < st.players ? 'Lock in and pass' : 'Lock in and start'}</button></div>
    </div>`;
  },

  roundIntro() {
    const g = G(), r = ROUNDS[g.round - 1];
    return `<div class="screen">${topbar(`Round ${g.round} of 3`)}
      <div class="pass">
        <p class="eyebrow">Round ${g.round} of 3 · ${plural(g.deck.length, 'card')}</p>
        <div class="big">${r.short}</div>
        <div class="rule-card"><div class="num">${g.round}</div><div><p>${r.rule}</p>${g.round > 1 ? '<p class="muted small" style="margin-top:6px">Same cards as last round, reshuffled.</p>' : ''}</div></div>
      </div>
      <div class="footer"><button class="btn primary block" data-a="toHandoff">Got it</button></div></div>`;
  },

  handoff() {
    const g = G(), st = S.settings, r = ROUNDS[g.round - 1];
    const carry = g.carry && g.carry.team === g.team ? g.carry.secs : null;
    const secs = carry != null ? carry : st.seconds;
    return `<div class="screen">${topbar(`Round ${g.round} · ${r.short}`)}
      <div class="pass">
        <p class="eyebrow">Next clue-giver from</p>
        <div class="who" style="font-size:24px"><span class="teamdot" style="background:${teamColor(g.team)};width:22px;height:22px"></span>${esc(g.teams[g.team].name)}</div>
        <div class="big">${secs}s</div>
        <p class="muted">${carry != null ? 'Leftover time from last round. ' : ''}${plural(g.pile.length, 'card')} left in round ${g.round}.</p>
        <div class="rule-card"><div class="num">${g.round}</div><div><h3>${r.short}</h3><p class="muted">${r.rule}</p></div></div>
      </div>
      <div class="footer"><button class="btn sun block" style="min-height:64px;font-size:22px" data-a="startTurn">Start turn</button>
        <button class="btn ghost block" data-a="go" data-v="scores">Scoreboard</button></div></div>`;
  },

  turn() {
    const g = G(), t = g.turn, c = g.deck[g.pile[0]];
    return `<div class="screen">
      <div class="turn-head">${teamPill(g.team)}<span class="grow muted small" style="font-weight:700;text-align:right">R${g.round} · ${ROUNDS[g.round - 1].short}</span>
        <button class="iconbtn" data-a="pause" aria-label="Pause">❚❚</button></div>
      <div class="timer" id="timer" style="--tc:${teamColor(g.team)}"><div class="fill" id="tfill"></div><span class="num" id="tnum">${Math.ceil(t.remaining / 1000)}</span></div>
      <div class="stage">${c ? cardHTML(c, 'enter') : ''}</div>
      <div class="turn-meta"><span>${plural(t.got.length, 'card')} this turn</span><span>${g.pile.length} left</span></div>
      <div class="turn-actions">
        <button class="btn" data-a="skip">Skip</button>
        <button class="btn got" data-a="got">Got it</button>
      </div>
    </div>`;
  },

  review() {
    const g = G(), t = g.turn;
    const pts = t.got.filter(x => !x.undo).reduce((s, x) => s + g.deck[x.i].pts, 0);
    const cleared = g.pile.length === 0 && t.got.every(x => !x.undo);
    return `<div class="screen">${topbar('Turn over', 'none')}
      <div class="row">${teamPill(g.team)}<span class="grow"></span></div>
      <div><div class="bigscore">+${pts}</div><p class="muted">${t.got.length ? `${plural(t.got.filter(x => !x.undo).length, 'card')} this turn${cleared ? '. The deck is clear!' : ''}` : 'No cards this turn. It happens.'}</p></div>
      <div class="scroll"><div class="list">
        ${t.got.map((x, k) => { const c = g.deck[x.i]; return `<div class="li ${x.undo ? 'off' : ''}"><span class="chip" style="--pc:${ptsColor(c.pts)}">${c.pts}</span><span class="nm">${esc(c.name)}</span>
          <button class="small-btn" data-a="undo" data-v="${k}">${x.undo ? 'Count it' : 'Undo'}</button></div>`; }).join('')}
      </div>${t.got.length ? '<p class="hint">Undo a card if it was tapped by mistake. It goes back in the pile.</p>' : ''}
      ${skippedHTML(skippedLocal(), c => `<button class="small-btn add" data-a="addSkipped" data-v="${c.i}">Add</button>`)}</div>
      <div class="footer"><button class="btn primary block" data-a="confirmTurn">${cleared ? (g.round < 3 ? 'End round' : 'See final scores') : 'Next team'}</button></div></div>`;
  },

  scores() {
    const g = G();
    return `<div class="screen">${topbar('Scoreboard', 'none')}
      <div class="scroll">${scoreTable()}<p class="muted small">Round ${g.round} of 3 · ${plural(g.pile.length, 'card')} left this round.</p></div>
      <div class="footer"><button class="btn primary block" data-a="go" data-v="handoff">Back to the game</button></div></div>`;
  },

  roundEnd() {
    const g = G();
    const next = g.carry ? g.carry.team : (g.team + 1) % g.teams.length;
    return `<div class="screen">${topbar(`End of round ${g.round}`)}
      <div class="scroll">
        <div><p class="eyebrow">Round ${g.round} done</p><h2>${esc(leaderLine())}</h2></div>
        ${scoreTable()}
        <p class="muted">Up next: round ${g.round + 1}, <b>${ROUNDS[g.round].short}</b>. ${esc(g.teams[next].name)} goes first${g.carry ? ` with ${g.carry.secs} leftover seconds` : ''}.</p>
      </div>
      <div class="footer"><button class="btn primary block" data-a="nextRound">Start round ${g.round + 1}</button></div></div>`;
  },

  over() {
    const g = G(), tot = totals();
    const best = Math.max(...tot);
    const winners = g.teams.map((t, i) => i).filter(i => tot[i] === best);
    const headline = winners.length > 1 ? 'It’s a tie!' : `${g.teams[winners[0]].name} wins!`;
    return `<div class="screen">${topbar('Final scores', 'none')}
      <div class="scroll">
        <div class="winner"><p class="eyebrow">Game over</p><div class="crown">${esc(headline)}</div>
          <div class="row" style="justify-content:center;flex-wrap:wrap">${winners.map(i => teamPill(i)).join('')}</div></div>
        ${scoreTable()}
      </div>
      <div class="footer"><button class="btn primary block" data-a="rematch">Play again, same teams</button>
        <button class="btn ghost block" data-a="quit">Home</button></div></div>`;
  },
};

function totals() { const g = G(); return g.scores.map(r => r.reduce((a, b) => a + b, 0)); }
function leaderLine() {
  const g = G(), tot = totals(), best = Math.max(...tot);
  const lead = g.teams.map((t, i) => i).filter(i => tot[i] === best);
  if (lead.length > 1) return 'Dead even so far';
  const second = Math.max(...tot.filter((_, i) => i !== lead[0]));
  return `${g.teams[lead[0]].name} leads by ${best - second}`;
}
function scoreTable() {
  const g = G(), tot = totals();
  return `<div class="tablewrap"><table class="scoretable"><thead><tr><th>Team</th>${[1, 2, 3].map(r => `<th>R${r}</th>`).join('')}<th>Total</th></tr></thead><tbody>
    ${g.teams.map((t, i) => `<tr><td><span class="tn"><span class="teamdot" style="background:${teamColor(i)}"></span>${esc(t.name)}</span></td>
      ${g.scores[i].map((s, r) => `<td>${r < g.round || g.phase === 'over' || s ? s : '–'}</td>`).join('')}<td class="total">${tot[i]}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function render() {
  const v = VIEWS[S.screen] || VIEWS.home;
  // Views re-render whenever another phone acts, so keep the cursor where it was.
  const a = document.activeElement, keep = a && a.id && a.tagName === 'INPUT' ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  $app.innerHTML = v();
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  renderOverlay();
  if (S.screen === 'turn') tickTimer(); else stopLoop();
  if (S.screen === 'net' && N.view && N.view.phase === 'turn') { if (!netLoop) netLoop = setInterval(netTimer, 100); netTimer(); }
  else if (netLoop) { clearInterval(netLoop); netLoop = null; }
}

// Cards skipped this turn that are still in the pile, so a skip that was really a guess can be added back.
function skippedHTML(cards, btn) {
  if (!cards.length) return '';
  return `<p class="eyebrow" style="margin-top:6px">Skipped this turn</p><div class="list">
    ${cards.map(c => `<div class="li skipped"><span class="chip" style="--pc:${ptsColor(c.pts)}">${c.pts}</span><span class="nm">${esc(c.name)}</span>${btn(c)}</div>`).join('')}
  </div><p class="hint">Did they actually get one of these? Add it to the score.</p>`;
}

/* ---------- Overlays ---------- */
let overlay = null; // 'menu' | 'pause' | 'timeup' | 'confirmQuit'
function renderOverlay() {
  if (!overlay) { $ov.innerHTML = ''; return; }
  const g = G();
  let body = '';
  if (overlay.startsWith('net')) body = netOverlay();
  else if (overlay === 'menu') {
    body = `<h3>Game menu</h3>
      ${g && g.phase === 'play' ? `<button class="btn block" data-a="ov" data-v="">Keep playing</button><button class="btn block" data-a="openScores">Scoreboard</button>` : `<button class="btn block" data-a="ov" data-v="">Keep going</button>`}
      <button class="btn block" data-a="go" data-v="rules-from-game">How to play</button>
      <button class="btn block" data-a="ov" data-v="confirmQuit" style="color:var(--bad)">Quit this game</button>`;
  } else if (overlay === 'confirmQuit') {
    body = `<h3>Quit this game?</h3><p class="muted">Scores and the deck will be thrown away.</p>
      <button class="btn block" style="background:var(--bad);border-color:var(--bad);color:#fff" data-a="quit">Quit game</button>
      <button class="btn ghost block" data-a="ov" data-v="${S.screen === 'turn' ? 'pause' : ''}">Cancel</button>`;
  } else if (overlay === 'pause') {
    body = `<h3>Paused</h3><p class="muted">${Math.ceil(g.turn.remaining / 1000)} seconds left. The card is hidden.</p>
      <button class="btn primary block" data-a="resumeTurn">Resume</button>
      <button class="btn block" data-a="endTurnEarly">End turn now</button>
      <button class="btn ghost block" data-a="ov" data-v="confirmQuit" style="color:var(--bad)">Quit game</button>`;
  } else if (overlay === 'timeup') {
    const c = g.deck[g.pile[0]];
    body = `<p class="eyebrow">Time's up</p><h2>Did they get it?</h2>
      ${c ? `<div class="li"><span class="chip" style="--pc:${ptsColor(c.pts)}">${c.pts}</span><span class="nm">${esc(c.name)}</span></div>` : ''}
      <div class="row"><button class="btn grow" data-a="lastCard" data-v="0">No</button><button class="btn got grow" data-a="lastCard" data-v="1">Yes, count it</button></div>`;
  }
  $ov.innerHTML = `<div class="overlay" ${overlay === 'timeup' ? '' : 'data-a="ovBackdrop"'}><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
}

/* ---------- Timer ---------- */
let loop = null, lastBeep = null;
function stopLoop() { if (loop) { clearInterval(loop); loop = null; } }
function tickTimer() {
  stopLoop();
  updateTimerDOM();
  if (G().turn.running) loop = setInterval(updateTimerDOM, 100);
}
function updateTimerDOM() {
  const g = G(); if (!g || !g.turn) return;
  const t = g.turn;
  if (t.running) {
    t.remaining = Math.max(0, t.endsAt - Date.now());
    const s = Math.ceil(t.remaining / 1000);
    if (s <= 5 && s > 0 && s !== lastBeep) { lastBeep = s; beep(880, 0.08, 0.12); }
    if (t.remaining <= 0) { timeUp(); return; }
  }
  const num = document.getElementById('tnum'), fill = document.getElementById('tfill'), box = document.getElementById('timer');
  if (!num) return;
  const secs = Math.ceil(t.remaining / 1000);
  num.textContent = secs;
  fill.style.transform = `scaleX(${clamp(t.remaining / t.total, 0, 1)})`;
  box.classList.toggle('low', secs <= 10);
}
function timeUp() {
  const g = G();
  stopLoop();
  g.turn.running = false; g.turn.remaining = 0;
  beep(220, 0.6, 0.25, 'sawtooth'); buzz([200, 80, 200]);
  dropWake();
  overlay = g.pile.length ? 'timeup' : null;
  if (!g.pile.length) { S.screen = 'review'; }
  save(); render();
}

/* ---------- Game flow ---------- */
function newGame(deck) {
  const st = S.settings;
  S.game = {
    phase: 'play', teams: st.teams.map(t => ({ name: (t.name || '').trim() || 'Team' })),
    deck, round: 1, pile: shuffle(deck.map((_, i) => i)), team: 0,
    scores: st.teams.map(() => [0, 0, 0]), carry: null, turn: null,
  };
  S.screen = 'roundIntro';
}
function startTurn() {
  const g = G(), st = S.settings;
  audio();
  let secs = st.seconds;
  if (g.carry && g.carry.team === g.team) secs = g.carry.secs;
  g.carry = null;
  g.turn = { total: secs * 1000, remaining: secs * 1000, endsAt: Date.now() + secs * 1000, running: true, got: [] };
  lastBeep = null;
  S.screen = 'turn';
  beep(660, 0.12, 0.15);
  holdWake();
}
// Ignore a second tap within 300ms so a double-tap can't burn two cards.
let lastTap = 0;
function tooFast() { const now = Date.now(); if (now - lastTap < 300) return true; lastTap = now; return false; }
function finishTurnEmpty() {
  const g = G(), t = g.turn, st = S.settings;
  t.running = false; t.remaining = Math.max(0, t.endsAt - Date.now());
  const left = Math.floor(t.remaining / 1000);
  if (st.carry && g.round < 3 && left >= 3) g.carry = { team: g.team, secs: left };
  stopLoop(); dropWake();
  beep(988, 0.12, 0.15); setTimeout(() => beep(1318, 0.2, 0.15), 120);
  S.screen = 'review';
}

const ACT = {
  go(v) {
    if (v === 'rules-from-game') { overlay = null; S.returnTo = S.screen; S.screen = 'rules'; return; }
    if (v === 'home' && S.returnTo) { S.screen = S.returnTo; S.returnTo = null; return; }
    if (v === 'setup') S.game = S.game && S.game.phase === 'play' ? S.game : null;
    overlay = null; S.screen = v;
  },
  menu() { overlay = 'menu'; },
  ov(v) { overlay = v || null; },
  ovBackdrop(v, el, e) { if (e.target === el) { overlay = overlay === 'pause' ? 'pause' : null; } },
  openScores() { overlay = null; S.screen = 'scores'; },
  resume() { S.screen = S.game.screenBeforeHome || 'handoff'; if (S.screen === 'turn') { pauseState(); overlay = 'pause'; } },
  quit() { overlay = null; dropWake(); S.game = null; S.screen = 'home'; },

  teams(v) {
    const st = S.settings, n = clamp(st.teams.length + +v, 2, 4);
    while (st.teams.length < n) st.teams.push({ name: `Team ${TEAM_NAMES[st.teams.length]}` });
    st.teams.length = n;
  },
  players(v) {
    const st = S.settings;
    st.players = clamp(st.players + +v, 2, 20);
    st.keep = suggestKeep(st.players);
    st.deal = st.keep + 3;
    normalize();
  },
  mode(v) { S.settings.mode = v; normalize(); },
  deal(v) { const st = S.settings; st.deal = clamp(st.deal + +v, st.keep + 1, maxDeal(st.players)); },
  keep(v) {
    const st = S.settings;
    const max = st.mode === 'draft' ? st.deal - 1 : st.mode === 'custom' ? 10 : Math.floor(CARDS.length / st.players);
    st.keep = clamp(st.keep + +v, 1, max);
  },
  secs(v) { S.settings.seconds = +v; },
  carry() { S.settings.carry = !S.settings.carry; },

  begin() {
    const st = S.settings;
    normalize();
    S.game = null;
    if (st.mode === 'quick') { newGame(shuffle(CARDS).slice(0, deckSize(st))); return; }
    const base = { phase: 'build', teams: st.teams, deck: [] };
    if (st.mode === 'draft') {
      S.game = { ...base, draft: { player: 0, pool: shuffle(CARDS), hand: [], picked: [], reveal: false } };
      S.screen = 'draft';
    } else {
      S.game = { ...base, custom: { player: 0, entries: Array(st.keep).fill(''), reveal: false } };
      S.screen = 'custom';
    }
  },
  reveal() {
    const g = G();
    if (S.screen === 'draft') { const d = g.draft; d.hand = d.pool.splice(0, S.settings.deal); d.picked = []; d.reveal = true; }
    else { g.custom.reveal = true; }
  },
  pick(v) {
    const d = G().draft, i = +v, k = d.picked.indexOf(i);
    if (k >= 0) d.picked.splice(k, 1);
    else if (d.picked.length < S.settings.keep) d.picked.push(i);
  },
  draftDone() {
    const g = G(), d = g.draft, st = S.settings;
    g.deck.push(...d.picked.map(i => d.hand[i]));
    if (d.player + 1 < st.players) { d.player++; d.reveal = false; d.hand = []; d.picked = []; }
    else newGame(g.deck);
  },
  customDone() {
    const g = G(), c = g.custom, st = S.settings;
    c.entries.forEach(v => { v = v.trim(); if (v) g.deck.push({ pts: 1, name: v, desc: `Written by player ${c.player + 1}`, custom: true }); });
    if (c.player + 1 < st.players) { c.player++; c.reveal = false; c.entries = Array(st.keep).fill(''); }
    else {
      const need = st.players * st.keep - g.deck.length;
      if (need > 0) g.deck.push(...shuffle(CARDS).slice(0, need));
      newGame(g.deck);
    }
  },

  toHandoff() { S.screen = 'handoff'; },
  startTurn,
  got() {
    const g = G(), t = g.turn; if (!t.running || !g.pile.length || tooFast(t)) return;
    t.got.push({ i: g.pile.shift() });
    buzz(25);
    if (!g.pile.length) finishTurnEmpty(); else beep(1046, 0.07, 0.1);
  },
  skip() {

function clientOpen() {
  if (N.peer && !N.peer.destroyed) return;
  setStatus('connecting');
  const peer = new Peer(peerOpts());
  N.peer = peer;
  peer.on('open', () => clientConnect());
  peer.on('disconnected', () => { if (!(N.conn && N.conn.open)) setStatus('lost'); });
  peer.on('error', err => {
    if (err.type === 'peer-unavailable') {
      N.connecting = false;
      if (!N.joined) { netReset(); N.error = `No game found with code ${N.form.code}. Check the code with the host.`; S.screen = 'joinForm'; render(); }
      else setStatus('waitingHost');
    } else if (peer.destroyed || peer.disconnected) setStatus('lost');
  });
}
function clientConnect() {
  if (!N.peer || !N.peer.open || N.connecting || (N.conn && N.conn.open)) return;
  N.connecting = true;
  const conn = N.peer.connect(PEER_PREFIX + N.code.toLowerCase(), { serialization: 'json', reliable: true });
  N.conn = conn;
  const giveUp = setTimeout(() => { if (!conn.open) { N.connecting = false; try { conn.close(); } catch (e) {} } }, 10000);
  conn.on('open', () => { clearTimeout(giveUp); N.connecting = false; N.joined = true; saveNet(); setStatus('online'); conn.send({ t: 'hello', pid: N.pid, name: N.name }); });
  conn.on('data', msg => {
    if (!msg || typeof msg !== 'object') return;
    if (msg.t === 'view') applyView(msg.v);
    if (msg.t === 'kicked' || msg.t === 'ended') { netReset(); N.notice = msg.t === 'kicked' ? 'The host removed you from the game.' : 'The host ended the game.'; S.screen = 'home'; render(); }
  });
  conn.on('close', () => { clearTimeout(giveUp); N.connecting = false; if (N.conn === conn) { N.conn = null; setStatus('lost'); } });
  conn.on('error', () => { N.connecting = false; });
}
function send(a, v) {
  if (N.role === 'host') { hostAct(N.pid, a, v); return; }

// Phones drop connections when they sleep, so keep nudging everything back to life.
setInterval(() => {
  if (!N.role) return;
  if (!N.peer || N.peer.destroyed) { N.peer = null; N.role === 'host' ? hostOpen(false) : clientOpen(); return; }
  if (N.peer.disconnected) { try { N.peer.reconnect(); } catch (e) {} return; }
  if (N.role === 'host') { hostWatchPeers(); if (N.peer.open) setStatus('online'); }
  else if (N.conn && N.conn.open) { try { N.conn.send({ t: 'ping' }); } catch (e) {} }

}, 2500);

function netReset() {
  try { N.conn && N.conn.close(); } catch (e) {}

function netResume() {

      <div class="scroll"><div class="winner"><p class="eyebrow">Game over</p><div class="crown">${win.length > 1 ? 'It’s a tie!' : `${esc(v.teamNames[win[0]])} wins!`}</div>
        <div class="row" style="justify-content:center;flex-wrap:wrap">${win.map(i => netTeamPill(v, i)).join('')}</div></div>${netScoreTable(v)}</div>
      <div class="footer">${isHostV(v) ? `<button class="btn primary block" data-a="netSend" data-v="again">Play again, same room</button>` : `<p class="muted" style="text-align:center">${esc(nameOf(v, v.hostPid))} can start another game.</p>`}
        <button class="btn ghost block" data-a="ov" data-v="netLeave">Leave</button></div></div>`;
  },
};

VIEWS.net = () => {
  const v = N.view;
  if (!v) {
    return `<div class="screen">${netTop('Joining')}<div class="pass"><p class="eyebrow">Room ${esc(N.code)}</p><div class="big">Connecting…</div>
      <p class="muted">${N.status === 'waitingHost' ? "Can't reach the host's phone yet. Make sure the host still has the game open." : 'Finding the host’s phone.'}</p></div>
      <div class="footer"><button class="btn ghost block" data-a="netLeaveNow">Cancel</button></div></div>`;
  }
  return (NETVIEWS[v.phase] || NETVIEWS.lobby)(v);
};
VIEWS.hostForm = () => `<div class="screen">${topbar('Host a game', 'home')}
  <div class="scroll"><div class="panel"><div class="field"><label for="f-name">Your name</label>
    <input type="text" id="f-name" data-in="form" data-v="name" value="${esc(N.form.name)}" maxlength="16" autocomplete="off" autocapitalize="words" placeholder="e.g. Danny"></div>
    <p class="hint">Your phone runs the game, so keep this page open until it's over. Everyone else joins with a room code.</p></div>
    ${N.error ? `<p class="hint" style="color:var(--bad)">${esc(N.error)}</p>` : ''}</div>
  <div class="footer"><button class="btn primary block" data-a="netHost">Create room</button></div></div>`;
VIEWS.joinForm = () => `<div class="screen">${topbar('Join a game', 'home')}
  <div class="scroll"><div class="panel">
    <div class="field"><label for="f-code">Room code</label>
      <input type="text" id="f-code" class="codeinput" data-in="form" data-v="code" value="${esc(N.form.code)}" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD"></div>
    <div class="field"><label for="f-name">Your name</label>
      <input type="text" id="f-name" data-in="form" data-v="name" value="${esc(N.form.name)}" maxlength="16" autocomplete="off" autocapitalize="words" placeholder="e.g. Sam"></div></div>
    ${N.error ? `<p class="hint" style="color:var(--bad)">${esc(N.error)}</p>` : ''}</div>
  <div class="footer"><button class="btn primary block" data-a="netJoin">Join</button></div></div>`;

function netOverlay() {
  if (overlay === 'netMenu') {
    const v = N.view, host = N.role === 'host';
    return `<h3>Game menu</h3>
      <button class="btn block" data-a="ov" data-v="">Keep playing</button>
      ${v && v.scores ? `<button class="btn block" data-a="ov" data-v="netScores">Scoreboard</button>` : ''}
      <button class="btn block" data-a="go" data-v="rules-from-game">How to play</button>
      <button class="btn block" data-a="ov" data-v="netLeave" style="color:var(--bad)">${host ? 'End game for everyone' : 'Leave game'}</button>`;
  }
  if (overlay === 'netScores') return `<h3>Scoreboard</h3>${netScoreTable(N.view)}<button class="btn block" data-a="ov" data-v="">Close</button>`;
  if (overlay === 'netLeave') {
    const host = N.role === 'host';
    return `<h3>${host ? 'End the game for everyone?' : 'Leave this game?'}</h3>
      <p class="muted">${host ? 'Everyone gets sent back to the start screen.' : 'You can rejoin with the same code while the game is running.'}</p>
      <button class="btn block" style="background:var(--bad);border-color:var(--bad);color:#fff" data-a="netLeaveNow">${host ? 'End game' : 'Leave'}</button>
      <button class="btn ghost block" data-a="ov" data-v="">Cancel</button>`;
  }
  return '';
}

Object.assign(ACT, {
  netHostForm() { N.error = ''; S.screen = 'hostForm'; },
  netJoinForm() { N.error = ''; S.screen = 'joinForm'; },
  netHost() {
    const name = cleanName(N.form.name);
    if (!N.form.name.trim()) { N.error = 'Add your name so friends know whose room this is.'; return; }
    lsSet(NAME_KEY, name); audio();
    netReset();
    N.role = 'host'; N.name = name; N.code = newCode(); N.H = newHostState(name);
    saveNet(); S.screen = 'net'; holdWake();
    broadcast(); hostOpen(true);
  },
  netJoin() {
    const code = cleanCode(N.form.code), name = cleanName(N.form.name);
    if (code.length !== 4) { N.error = 'Room codes are 4 letters.'; return; }
    if (!N.form.name.trim()) { N.error = 'Add your name so your team knows who you are.'; return; }
    lsSet(NAME_KEY, name); audio();
    netReset();
    N.form.code = code; N.role = 'client'; N.name = name; N.code = code;
    S.screen = 'net'; holdWake();
    clientOpen();
  },
  netSend(v, el) {
    audio();
    const x = el && el.dataset.x;
    send(v, x === undefined ? undefined : x);
  },
  netSet(v, el) { send('set', { k: v, v: el.dataset.x }); },
  netPick(v) {
    const i = +v, k = N.picks.indexOf(i);
    if (k >= 0) N.picks.splice(k, 1); else if (N.picks.length < N.view.settings.keep) N.picks.push(i);
  },
  netDraftDone() { send('draft', N.picks.slice()); },
  netCustomDone() { send('custom', N.entries.slice()); },
  copyInvite(v, el) {
    const link = inviteLink();
    const done = () => { el.textContent = 'Link copied'; };
    try {
      if (navigator.share) { navigator.share({ title: 'Danny Abbo’s very own Monikers', text: `Join my Monikers game. Room code ${N.code}`, url: link }).catch(() => {}); return; }
      navigator.clipboard.writeText(link).then(done, () => { el.textContent = link; });
    } catch (e) { el.textContent = link; }
  },
  netLeaveNow() {
    overlay = null;
    if (N.role === 'host') { for (const c of N.conns.values()) { try { c.send({ t: 'ended' }); } catch (e) {} } }
    else send('leave');
    setTimeout(netReset, N.role === 'host' ? 300 : 150);
    S.screen = 'home';
  },
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.in;
  if (k === 'form') { N.form[el.dataset.v] = el.dataset.v === 'code' ? (el.value = cleanCode(el.value)) : el.value; N.error = ''; }
  if (k === 'netName') N.entries[+el.dataset.v] = el.value;
  if (k === 'netTeam') { clearTimeout(el._t); el._t = setTimeout(() => send('set', { k: 'teamName', i: +el.dataset.v, v: el.value }), 250); }
});

let netLoop = null, netLastBeep = null;
function netTimer() {
  const v = N.view; if (!v || !v.turn) return;
  const rem = v.turn.running ? Math.max(0, N.endsAt - Date.now()) : v.turn.remaining;
  const s = Math.ceil(rem / 1000);
  if (v.turn.running && v.giver === v.me && s <= 5 && s > 0 && s !== netLastBeep) { netLastBeep = s; beep(880, 0.08, 0.12); }
  const num = document.getElementById('tnum'), fill = document.getElementById('tfill'), box = document.getElementById('timer');
  if (!num) return;
  num.textContent = s;
  fill.style.transform = `scaleX(${clamp(rem / v.turn.total, 0, 1)})`;
  box.classList.toggle('low', s <= 10);
}

/* ---------- Boot ---------- */
function start(data) {
  S = (data && data.screen) ? data : (load() || fresh());
  if (!S.settings) S.settings = defaultSettings();
  // A reload mid-turn comes back paused so nobody loses time.
  if (S.screen === 'turn' && S.game && S.game.turn) { pauseState(); overlay = 'pause'; }
  if (S.game && S.game.phase === 'build' && !['draft', 'custom'].includes(S.screen)) S.game = null;
  if (!netResume()) {
    if (['net', 'hostForm', 'joinForm'].includes(S.screen)) S.screen = 'home';
    const room = cleanCode(new URLSearchParams(location.search).get('room'));
    if (room && NET_OK) { N.form.code = room; S.screen = 'joinForm'; }
  }
  render();
}
try { window.claude?.hot?.snapshot?.(() => S); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);

if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.claude) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
<!--ARTIFACT-BODY-END-->
</body>
